# Super native vLLM OffloadingConnector Go/No-Go smoke.
#
# This is option 3 after KVBM. KVBM's DynamoConnector does not support HMA in
# the current image, while Super requires HMA for Mamba + full-attention cache
# groups. Native OffloadingConnector is the next candidate because Dynamo/vLLM
# docs validate it with Mamba/SSM models.
#
# This tests CPU offload first, not disk. Disk/multi-tier native offload is a
# later axis after the connector starts and proves TTFT improvement.
---
apiVersion: v1
kind: Service
metadata:
  name: super-native-offload-smoke-frontend-ext
  namespace: dynamo-system
spec:
  type: NodePort
  selector:
    nvidia.com/selector: super-native-offload-smoke-frontend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30807
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: super-native-offload-smoke
  namespace: dynamo-system
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: dynamo-vllm-lmcache:1.3.0-lmc052-arm64
              imagePullPolicy: IfNotPresent
              command: ["python3"]
              args:
                - -m
                - dynamo.frontend
              env:
                - name: DYN_ROUTER_MODE
                  value: "kv"
                - name: DYN_ROUTER_HOST_CACHE_HIT_WEIGHT
                  value: "1.0"
                - name: DYN_ROUTER_PREFILL_LOAD_SCALE
                  value: "10"
                - name: PYTHONHASHSEED
                  value: "0"
              ports:
                - { name: http, containerPort: 8000 }
              startupProbe:
                httpGet: { path: /health, port: 8000 }
                periodSeconds: 10
                failureThreshold: 80

    - name: VllmDecodeWorker
      type: worker
      replicas: 2
      podTemplate:
        spec:
          hostNetwork: true
          hostIPC: true
          dnsPolicy: ClusterFirstWithHostNet
          volumes:
            - name: hf-cache
              hostPath: { path: /home/user/hf-cache, type: Directory }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 24Gi }
          containers:
            - name: main
              image: dynamo-vllm-lmcache:1.3.0-lmc052-arm64
              imagePullPolicy: IfNotPresent
              command: ["python3"]
              args:
                - -m
                - dynamo.vllm
                - --model
                - nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
                - --served-model-name
                - nemotron
                - --trust-remote-code
                - --load-format
                - fastsafetensors
                - --moe-backend
                - cutlass
                - --kv-cache-dtype
                - fp8
                - --mamba-ssm-cache-dtype
                - bfloat16
                - --mamba-cache-mode
                - align
                - --enable-chunked-prefill
                - --enable-prefix-caching
                - --no-disable-hybrid-kv-cache-manager
                - --dyn-reasoning-parser
                - nemotron_v3
                - --dyn-tool-call-parser
                - nemotron_nano
                - --max-model-len
                - "131072"
                - --max-num-seqs
                - "8"
                - --max-num-batched-tokens
                - "8447"
                - --kv-cache-memory-bytes
                - "4000000000"
                - --gpu-memory-utilization
                - "0.82"
                - --kv-transfer-config
                - '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":4294967296,"block_size":4224,"self_describing_kv_events":true}}'
                - --kv-events-config
                - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
              env:
                - name: PYTHONHASHSEED
                  value: "0"
                - name: UCX_NET_DEVICES
                  value: "rocep1s0f1:1,roceP2p1s0f1:1"
                - name: UCX_MAX_RNDV_RAILS
                  value: "2"
                - name: UCX_CM_USE_ALL_DEVICES
                  value: "y"
                # Enable if logs ask for it:
                #   RuntimeError: 3-read Mamba conv transfer requires DS conv state layout
                - name: VLLM_SSM_CONV_STATE_LAYOUT
                  value: ""
                - name: HF_HOME
                  value: "/hf-cache"
                - name: HF_HUB_OFFLINE
                  value: "1"
                - name: VLLM_OMNI_USE_QUACK_FP8
                  value: "0"
              securityContext:
                capabilities:
                  add: [IPC_LOCK, SYS_RESOURCE]
                runAsUser: 0
              resources:
                limits:
                  nvidia.com/gpu: "1"
                  rdma/rdma_shared_device_a: "1"
                  rdma/rdma_shared_device_b: "1"
                requests:
                  nvidia.com/gpu: "1"
                  rdma/rdma_shared_device_a: "1"
                  rdma/rdma_shared_device_b: "1"
                  memory: 24Gi
              volumeMounts:
                - { name: hf-cache, mountPath: /hf-cache }
                - { name: dshm, mountPath: /dev/shm }
              startupProbe:
                httpGet: { path: /live, port: 9090 }
                periodSeconds: 30
                failureThreshold: 100
