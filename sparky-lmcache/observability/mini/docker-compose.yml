# Mac Mini control plane. All images have linux/arm64 builds.
# If a tag 404s, switch to :latest, then pin whatever you actually got.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: obs-prometheus
    restart: unless-stopped
    ports: ["${PROM_PORT:-9091}:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
      # required for tempo's metrics_generator remote_write
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    extra_hosts: ["host.docker.internal:host-gateway"]

  loki:
    image: grafana/loki:3.3.2
    container_name: obs-loki
    restart: unless-stopped
    ports: ["${LOKI_PORT:-3102}:3100"]   # promtail on the Sparks pushes here
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: grafana/tempo:2.7.0
    container_name: obs-tempo
    restart: unless-stopped
    ports:
      # 3200 (query API) is deliberately not published: grafana reaches it as
      # tempo:3200 on the compose network, so a host binding buys nothing and
      # only adds a collision surface. Only the OTLP receivers need publishing,
      # because the Sparks push to them.
      - "${OTLP_GRPC_PORT:-4317}:4317"   # <- vllm / lmcache / dynamo push here
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: obs-grafana
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3002}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

volumes:
  prom-data:
  loki-data:
  tempo-data:
  grafana-data:
