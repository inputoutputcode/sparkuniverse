# Three runs of one configuration, nothing changed between them.
#
# The point is the spread, not any individual number. run-sweep.sh redeploys
# between arms, so each of these starts from a cold cache exactly as the real
# arms do, and the variation that shows up is the variation any two arms carry
# before either of them differs in anything.
#
# Configuration is weka-c-p2p's, which is already the reference run:
# P2P on, L1 48 GiB, eviction 0.8 / 0.2. Its measured result was 92.00% cache
# read, 1,188.2 req/h, TTFT p90 3,504 ms.
#
# About 3 hours each, so 9 hours. One night.
#
# Why this cannot be done more cheaply: a shorter trace would give a floor for
# a shorter run, and there is no reason to assume hit-rate variance scales with
# request count the way a sample mean does. The cache state trajectory is the
# thing varying, and it depends on run length.

weka-c-rep1 | nano-agg-p2p.yaml | P2P_ENABLED=1 EVICTION_WATERMARK=0.8 EVICTION_RATIO=0.2
weka-c-rep2 | nano-agg-p2p.yaml | P2P_ENABLED=1 EVICTION_WATERMARK=0.8 EVICTION_RATIO=0.2
weka-c-rep3 | nano-agg-p2p.yaml | P2P_ENABLED=1 EVICTION_WATERMARK=0.8 EVICTION_RATIO=0.2
