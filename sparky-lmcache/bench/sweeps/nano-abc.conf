# run_id | manifest | env overrides
#
# One arm per line, run top to bottom. Roughly 3 hours each on cc-weka-s85,
# plus about 6 minutes to redeploy and verify, so three arms is a night.
#
# Arms already complete are skipped automatically if runs/<id>/summary.json
# exists, so this file can be re-run after a partial night without redoing
# work.
#
# Order matters only in that the cheapest-to-lose should go last. Everything
# here is independent: each arm redeploys, so every one starts from a cold
# cache regardless of what ran before it.

# Arm B. L1 without P2P. The control for arm C, and the arm that separates
# "LMCache helps" from "sharing between nodes helps". Eviction pair matches the
# completed weka-c-p2p run at 0.8 / 0.2.
weka-b-l1only    | nano-agg-p2p.yaml        | P2P_ENABLED=0 EVICTION_WATERMARK=0.95 EVICTION_RATIO=0.05

# Arm A. Routing and the device prefix cache only, no LMCache at all, on a
# 56 GB arena that holds the whole 12.59M-token working set. This is the arm
# that asks whether LMCache is the right place to spend the memory on Nano.
weka-a-router    | nano-agg-router-only.yaml |

# Arm C repeated at the eviction band that keeps L1 nearer full. Against the
# completed weka-c-p2p this is a single variable: mean usable L1 goes from 0.70
# to 0.925 of the arena. Cache read can rise at most 2.30 points, since arm C
# already captured 97.6% of what the trace offers.
weka-c-evict95   | nano-agg-p2p.yaml        | P2P_ENABLED=1 EVICTION_WATERMARK=0.95 EVICTION_RATIO=0.05
