build-pipeline-summary:
  stage: review
  tags:
    - agenthost
  needs:
    - validate-real-evaluation
    - slurm-ddp-train
  script:
    - |
      set -euo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}"
      DDP_RUN_ID="ci-${CI_PIPELINE_ID}-ddp"

      mkdir -p artifacts

      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/metadata.json artifacts/metadata.json
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/metrics.json artifacts/metrics.json
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/evaluation.json artifacts/evaluation.json
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${DDP_RUN_ID}/ddp-metadata.json artifacts/ddp-metadata.json
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${DDP_RUN_ID}/ddp-metrics.json artifacts/ddp-metrics.json

      python3 - <<'PY'
      import json
      from pathlib import Path

      root = Path("artifacts")

      def read_json(name):
          path = root / name
          if not path.exists():
              raise SystemExit(f"missing required artifact: {path}")
          return json.loads(path.read_text())

      metadata = read_json("metadata.json")
      metrics = read_json("metrics.json")
      evaluation = read_json("evaluation.json")
      ddp_metadata = read_json("ddp-metadata.json")
      ddp_metrics = read_json("ddp-metrics.json")

      summary = {
          "pipeline": {
              "single_gpu_run_id": metadata.get("run_id"),
              "ddp_run_id": ddp_metadata.get("run_id"),
          },
          "single_gpu_training": {
              "host": metadata.get("host"),
              "device": metrics.get("device"),
              "cuda_available": metadata.get("cuda_available"),
              "cuda_device_name": metadata.get("cuda_device_name"),
              "final_loss": metrics.get("final_loss"),
              "avg_loss": metrics.get("avg_loss"),
              "elapsed_seconds": metrics.get("elapsed_seconds"),
          },
          "single_gpu_evaluation": {
              "host": evaluation.get("host"),
              "device": evaluation.get("device"),
              "accuracy": evaluation.get("accuracy"),
              "avg_eval_loss": evaluation.get("avg_eval_loss"),
              "elapsed_seconds": evaluation.get("elapsed_seconds"),
          },
          "ddp_training": {
              "training_type": ddp_metadata.get("training_type"),
              "world_size": ddp_metadata.get("world_size"),
              "hosts": ddp_metadata.get("hosts"),
              "cuda_available": ddp_metadata.get("cuda_available"),
              "cuda_device_name": ddp_metadata.get("cuda_device_name"),
              "global_batch_size": ddp_metrics.get("global_batch_size"),
              "avg_final_loss": ddp_metrics.get("avg_final_loss"),
              "avg_loss": ddp_metrics.get("avg_loss"),
              "elapsed_seconds": ddp_metrics.get("elapsed_seconds"),
          },
      }

      output_path = root / "pipeline-summary.json"
      output_path.write_text(json.dumps(summary, indent=2) + "\n")

      print(json.dumps(summary, indent=2))
      print(f"Wrote {output_path}")
      PY
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/

