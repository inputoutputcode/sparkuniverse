stages:
  - init
  - infra
  - train
  - evaluate
  - review

# init

runner-smoke:
  stage: init
  tags: 
    - agenthost
  script:
    - whoami
    - echo "$HOME"
    - hostname
    - pwd
    - uname -a
    - git --version
    - glab --version || true
    - ssh -V
    - |
      ssh chris@192.168.1.82 '
        hostname
        uname -a
        nvidia-smi
        which python3
        python3 --version
        which sbatch || true
        which srun || true
        which sinfo || true
      '

sync-project-files:
  stage: init
  tags:
    - agenthost
  needs:
  - runner-smoke
  script:
    - ssh chris@spark-38fc 'mkdir -p /srv/sparky-mlops/jobs /srv/sparky-mlops/runs'
    - ssh chris@spark-38fc 'rm -rf /srv/sparky-mlops/jobs/ml-training /srv/sparky-mlops/jobs/cluster-validation'
    - scp -r ml-training chris@spark-38fc:/srv/sparky-mlops/jobs/
    - scp -r cluster-validation chris@spark-38fc:/srv/sparky-mlops/jobs/

# infra

ansible-smoke:
  stage: infra
  tags: 
    - agenthost
  script:
    - ansible --version
    - ansible -i infra/ansible/inventory/hosts.ini dgx -m ping
    - ansible -i infra/ansible/inventory/hosts.ini dgx -m command -a "python3 --version"
    - ansible -i infra/ansible/inventory/hosts.ini dgx -m command -a "nvidia-smi"
    - ansible -i infra/ansible/inventory/hosts.ini dgx -m shell -a "which sbatch || true"

setup-shared-storage:
  stage: infra
  tags:
    - agenthost
  when: manual
  script:
    - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/setup-shared-storage.yml

dgx-prereq-check:
  stage: infra
  tags:
    - agenthost
  script:
    - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/check-dgx.yml

slurm-hello:
  stage: infra
  tags:
    - agenthost
  needs:
    - sync-project-files
  script:
    - |
      set -uo pipefail

      echo "Remote hello.sbatch:"
      ssh chris@spark-38fc 'nl -ba /srv/sparky-mlops/jobs/ml-training/slurm/hello.sbatch'

      echo "Submitting hello job..."
      set +e
      JOB_ID=$(ssh chris@spark-38fc 'sbatch --wait --parsable /srv/sparky-mlops/jobs/ml-training/slurm/hello.sbatch')
      RC=$?
      set -e

      echo "JOB_ID=${JOB_ID}"
      echo "RC=${RC}"

      echo "Accounting:"
      ssh chris@spark-38fc "sacct -j ${JOB_ID} --format=JobID%15,JobName%20,State%15,ExitCode%10,Elapsed,Timelimit,NodeList%30" || true

      echo "Job details:"
      ssh chris@spark-38fc "scontrol show job ${JOB_ID}" || true

      echo "Matching output files:"
      ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print" || true

      echo "Output content:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/*${JOB_ID}*.out" || true

      exit "${RC}"

setup-nccl-tests:
  stage: infra
  tags:
    - agenthost
  when: manual
  script:
    - ansible-playbook -i infra/ansible/inventory/hosts.ini infra/ansible/playbooks/setup-nccl-tests.yml

nccl-collectives:
  stage: infra
  tags:
    - agenthost
  needs:
    - sync-project-files
    - setup-nccl-tests
  when: manual
  script:
    - |
      set -euxo pipefail

      echo "Checking synced NCCL files:"
      ssh chris@spark-38fc "find /srv/sparky-mlops/jobs/cluster-validation -maxdepth 4 -type f -print | sort || true"

      echo "Checking nccl-tests binaries:"
      ssh chris@spark-38fc "ls -la /srv/sparky-mlops/jobs/nccl-tests/build || true"

      echo "Checking Slurm nodes:"
      ssh chris@spark-38fc "sinfo -Nel"
      ssh chris@spark-38fc "scontrol show node spark-38fc | grep -E 'NodeName=|Gres=|CfgTRES=|AllocTRES='"
      ssh chris@spark-38fc "scontrol show node spark-1ac4 | grep -E 'NodeName=|Gres=|CfgTRES=|AllocTRES='"

      echo "Submitting NCCL job..."
      set +e
      JOB_ID=$(ssh chris@spark-38fc 'sbatch --wait --parsable /srv/sparky-mlops/jobs/cluster-validation/slurm/nccl-collectives.sbatch')
      RC=$?
      set -e

      echo "JOB_ID=${JOB_ID}"
      echo "RC=${RC}"

      echo "Matching Slurm output files:"
      if [ -n "${JOB_ID}" ]; then
        ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print" || true

        OUT_FILE=$(ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print -quit")
        echo "OUT_FILE=${OUT_FILE}"

        if [ -n "${OUT_FILE}" ]; then
          ssh chris@spark-38fc "cat '${OUT_FILE}'"
        fi

        echo "Accounting:"
        ssh chris@spark-38fc "sacct -j ${JOB_ID} --format=JobID%15,JobName%25,State%15,ExitCode%10,Elapsed,Timelimit,NodeList%30" || true
      fi

      exit "${RC}"

warmup-hf-cache:
  stage: infra
  tags:
    - agenthost
  needs:
    - sync-project-files
  rules:
    - when: manual
  script:
    - |
      set -euo pipefail

      ssh chris@spark-38fc '/srv/sparky-mlops/venv/bin/python - <<'"'"'PY'"'"'
      from datasets import load_dataset
      from transformers import AutoModelForCausalLM, AutoTokenizer

      cache_dir = "/srv/sparky-mlops/hf-cache"
      model_name = "Qwen/Qwen2.5-0.5B-Instruct"
      dataset_name = "databricks/databricks-dolly-15k"

      print(f"warming model cache: {model_name}")
      AutoTokenizer.from_pretrained(model_name, cache_dir=cache_dir)
      AutoModelForCausalLM.from_pretrained(
          model_name,
          cache_dir=cache_dir,
          dtype="auto",
      )

      print(f"warming dataset cache: {dataset_name}")
      load_dataset(dataset_name, split="train", cache_dir=cache_dir)

      print("HF cache warmup complete")
      PY'

# train

slurm-fake-train:
  stage: train
  tags:
    - agenthost
  needs:
    - sync-project-files
  script:
    - |
      set -euxo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      echo "RUN_ID=${RUN_ID}"

      echo "Submitting training job..."
      set +e
      SUBMIT_OUTPUT=$(ssh chris@spark-38fc "cd /srv/sparky-mlops/jobs && RUN_ID=${RUN_ID} sbatch --wait --parsable ml-training/slurm/train.sbatch")
      SUBMIT_RC=$?
      set -e

      echo "SUBMIT_OUTPUT=${SUBMIT_OUTPUT}"
      echo "SUBMIT_RC=${SUBMIT_RC}"

      JOB_ID="${SUBMIT_OUTPUT}"
      test -n "${JOB_ID}" || true

      echo "Matching Slurm output files:"
      ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print" || true

      if [ -n "${JOB_ID}" ]; then
        OUT_FILE=$(ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print -quit")
        echo "OUT_FILE=${OUT_FILE}"
        if [ -n "${OUT_FILE}" ]; then
          ssh chris@spark-38fc "cat '${OUT_FILE}'"
        fi
      fi

      exit "${SUBMIT_RC}"

slurm-real-train:
  stage: train
  tags:
    - agenthost
  needs:
    - sync-project-files
    - slurm-fake-train
  script:
    - |
      set -uo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}"
      echo "RUN_ID=${RUN_ID}"

      echo "Remote train-real.sbatch:"
      ssh chris@spark-38fc 'nl -ba /srv/sparky-mlops/jobs/ml-training/slurm/train-real.sbatch'

      echo "Submitting real training job..."
      set +e
      JOB_ID=$(ssh chris@spark-38fc "cd /srv/sparky-mlops/jobs && RUN_ID=${RUN_ID} sbatch --wait --parsable ml-training/slurm/train-real.sbatch")
      RC=$?
      set -e

      echo "JOB_ID=${JOB_ID}"
      echo "RC=${RC}"

      echo "Accounting:"
      ssh chris@spark-38fc "sacct -j ${JOB_ID} --format=JobID%15,JobName%20,State%15,ExitCode%10,Elapsed,Timelimit,NodeList%30" || true

      echo "Matching output files:"
      ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print" || true

      echo "Slurm output:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/*${JOB_ID}*.out" || true

      echo "Training metadata:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/${RUN_ID}/metadata.json" || true

      echo "Training metrics:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/${RUN_ID}/metrics.json" || true

      exit "${RC}"

