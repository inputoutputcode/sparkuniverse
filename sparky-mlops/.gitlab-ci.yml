# evaluate

slurm-fake-train-evaluate:
  stage: evaluate
  when: on_success
  allow_failure: false
  tags:
    - agenthost
  needs:
    - sync-project-files
  script:
    - |
      set -euxo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      echo "RUN_ID=${RUN_ID}"

      TRAIN_JOB_ID=$(ssh chris@192.168.1.82 "cd /srv/sparky-mlops/jobs && RUN_ID=${RUN_ID} sbatch --wait --parsable ml-training/slurm/train.sbatch")
      echo "Submitted Slurm training job ${TRAIN_JOB_ID} for run ${RUN_ID}"
      test -n "${TRAIN_JOB_ID}"

      echo "Training Slurm output:"
      ssh chris@192.168.1.82 "cat /srv/sparky-mlops/runs/fake-train-${TRAIN_JOB_ID}-*.out"

      echo "Training metadata:"
      ssh chris@192.168.1.82 "cat /srv/sparky-mlops/runs/${RUN_ID}/metadata.json"

      EVAL_JOB_ID=$(ssh chris@192.168.1.82 "cd /srv/sparky-mlops/jobs/ && RUN_ID=${RUN_ID} sbatch --wait --parsable ml-training/slurm/evaluate.sbatch")
      echo "Submitted Slurm evaluation job ${EVAL_JOB_ID} for run ${RUN_ID}"
      test -n "${EVAL_JOB_ID}"

      echo "Evaluation Slurm output:"
      ssh chris@192.168.1.82 "cat /srv/sparky-mlops/runs//fake-eval-${EVAL_JOB_ID}-*.out"

      echo "Evaluation metrics:"
      ssh chris@192.168.1.82 "cat /srv/sparky-mlops/runs//${RUN_ID}/metrics.json"

slurm-real-evaluate:
  stage: evaluate
  tags:
    - agenthost
  needs:
    - slurm-real-train
    - slurm-fake-train-evaluate
  script:
    - |
      set -uo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}"
      echo "RUN_ID=${RUN_ID}"

      echo "Remote evaluate-real.sbatch:"
      ssh chris@spark-38fc 'nl -ba /srv/sparky-mlops/jobs/ml-training/slurm/evaluate-real.sbatch'

      echo "Submitting real evaluation job..."
      set +e
      JOB_ID=$(ssh chris@spark-38fc "cd /srv/sparky-mlops/jobs && RUN_ID=${RUN_ID} sbatch --wait --parsable ml-training/slurm/evaluate-real.sbatch")
