      ssh chris@spark-38fc "sacct -j ${JOB_ID} --format=JobID%15,JobName%20,State%15,ExitCode%10,Elapsed,Timelimit,NodeList%30" || true

      echo "Matching output files:"
      ssh chris@spark-38fc "find /srv/sparky-mlops/runs -maxdepth 1 -type f -name '*${JOB_ID}*.out' -print" || true

      echo "Slurm output:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/*${JOB_ID}*.out" || true

      echo "Training metadata:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/${RUN_ID}/metadata.json" || true

      echo "Training metrics:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/${RUN_ID}/metrics.json" || true

      echo "Evaluation:"
      ssh chris@spark-38fc "cat /srv/sparky-mlops/runs/${RUN_ID}/evaluation.json" || true

      exit "${RC}"

collect-run-artifacts:
  stage: evaluate
  tags:
    - agenthost
  needs:
    - slurm-real-evaluate
  script:
    - |
      set -euo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}"
      mkdir -p artifacts/${RUN_ID}

      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/metadata.json artifacts/${RUN_ID}/
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/metrics.json artifacts/${RUN_ID}/
      scp chris@spark-38fc:/srv/sparky-mlops/runs/${RUN_ID}/evaluation.json artifacts/${RUN_ID}/

      echo "Collected artifacts:"
      find artifacts -type f -maxdepth 3 -print
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/

validate-real-evaluation:
  stage: evaluate
  tags:
    - agenthost
  needs:
    - collect-run-artifacts
  script:
    - |
      set -euo pipefail

      RUN_ID="ci-${CI_PIPELINE_ID}"
      EVAL_PATH="artifacts/${RUN_ID}/evaluation.json"
      METRICS_PATH="artifacts/${RUN_ID}/metrics.json"
      METADATA_PATH="artifacts/${RUN_ID}/metadata.json"

      python3 - <<PY
      import json
      import math
      from pathlib import Path

      eval_path = Path("${EVAL_PATH}")
      metrics_path = Path("${METRICS_PATH}")
      metadata_path = Path("${METADATA_PATH}")

      for path in [eval_path, metrics_path, metadata_path]:
          if not path.exists():
              raise SystemExit(f"missing artifact: {path}")

      evaluation = json.loads(eval_path.read_text())
      metrics = json.loads(metrics_path.read_text())
      metadata = json.loads(metadata_path.read_text())

      required_eval = ["accuracy", "avg_eval_loss", "elapsed_seconds", "device"]
      for key in required_eval:
          if key not in evaluation:
              raise SystemExit(f"evaluation missing key: {key}")

      numeric_eval = ["accuracy", "avg_eval_loss", "elapsed_seconds"]
      for key in numeric_eval:
          value = evaluation[key]
          if not isinstance(value, (int, float)) or not math.isfinite(value):
              raise SystemExit(f"evaluation key is not finite numeric: {key}={value}")

      if evaluation["device"] != "cuda":
          raise SystemExit(f"evaluation did not run on cuda: {evaluation['device']}")

      if not metadata.get("cuda_available"):
          raise SystemExit("training metadata says cuda_available is false")

      if "final_loss" not in metrics:
          raise SystemExit("training metrics missing final_loss")

      print("Evaluation validation passed")
      print(json.dumps({
          "run_id": evaluation.get("run_id"),
          "accuracy": evaluation["accuracy"],
          "avg_eval_loss": evaluation["avg_eval_loss"],
          "training_final_loss": metrics["final_loss"],
          "device": evaluation["device"],
          "training_host": metadata.get("host"),
          "evaluation_host": evaluation.get("host"),
      }, indent=2))
      PY

